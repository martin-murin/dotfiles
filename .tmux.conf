# Set history limit
set -g history-limit 50000

# Vim-style splits
bind v split-window -h
bind s split-window -v

# Easier pane navigation (Ctrl+h/j/k/l)
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Use vm keys in copy mode
setw -g mode-keys vi

# Vi-style selection/copy in copy-mode
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Send copied text to system clipboard (needs xclip on X11)
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Paste tmux buffer with prefix+p (already default, just noting it)
bind p paste-buffer

# --- tmux-resurrect / tmux-continuum ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# must be the last line
run '~/.tmux/plugins/tpm/tpm'
